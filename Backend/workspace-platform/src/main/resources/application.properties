spring.application.name=workspace-platform

# Database Connection
spring.datasource.url=jdbc:mysql://localhost:3306/collaborative_workspace
spring.datasource.username=root
# Set DB_PASSWORD to your local MySQL root password before running the app.
# Alternatively, set it in PowerShell for your current session with:
# $env:DB_PASSWORD="YOUR_ACTUAL_MYSQL_PASSWORD"
spring.datasource.password=${DB_PASSWORD}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

